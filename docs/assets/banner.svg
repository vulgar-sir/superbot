<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">superbot — self-hosted multi-agent collaboration</title>
  <desc id="desc">A dark banner with the superbot wordmark and a network of connected agent nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <line x1="0" y1="319" x2="1280" y2="319" stroke="#1f2937"/>

  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif">
    <g>
      <rect x="72" y="54" width="252" height="32" rx="16" fill="#14b8a6" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <circle cx="92" cy="70" r="4" fill="#5eead4"/>
      <text x="104" y="74.5" fill="#99f6e4" font-size="12" font-weight="600" letter-spacing="1.8">SELF-HOSTED · OPEN SOURCE</text>
    </g>

    <text x="72" y="176" fill="#f8fafc" font-size="88" font-weight="700" letter-spacing="-3">superbot</text>
    <text x="74" y="218" fill="#94a3b8" font-size="21" font-weight="400">Multi-agent collaboration, on your own server.</text>

    <g font-size="13" font-weight="600">
      <rect x="72" y="250" width="58" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="101" y="271" fill="#7dd3fc" text-anchor="middle">Go</text>

      <rect x="140" y="250" width="92" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="186" y="271" fill="#e2e8f0" text-anchor="middle">Next.js</text>

      <rect x="242" y="250" width="122" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="303" y="271" fill="#a5b4fc" text-anchor="middle">PostgreSQL</text>

      <rect x="374" y="250" width="88" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="418" y="271" fill="#93c5fd" text-anchor="middle">Docker</text>
    </g>
  </g>

  <g transform="translate(1000 158)">
    <circle r="154" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 7"/>
    <circle r="112" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
    <circle r="42" fill="#14b8a6" opacity="0.18" filter="url(#soft)"/>

    <g stroke="#334155" stroke-width="2" opacity="0.85">
      <line x1="0" y1="0" x2="-96" y2="-70"/>
      <line x1="0" y1="0" x2="100" y2="-70"/>
      <line x1="0" y1="0" x2="-96" y2="74"/>
      <line x1="0" y1="0" x2="100" y2="74"/>
      <line x1="0" y1="0" x2="0" y2="-108"/>
    </g>

    <g>
      <circle cx="0" cy="0" r="36" fill="#0f766e" stroke="#5eead4" stroke-width="1.5"/>
      <text x="0" y="6" fill="#f0fdfa" font-size="18" font-weight="700" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, sans-serif">sb</text>
    </g>

    <g font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="-96" cy="-70" r="24" fill="#4338ca" stroke="#818cf8" stroke-width="1.25"/>
      <text x="-96" y="-65" fill="#eef2ff">A</text>

      <circle cx="100" cy="-70" r="24" fill="#b45309" stroke="#fbbf24" stroke-width="1.25"/>
      <text x="100" y="-65" fill="#fffbeb">B</text>

      <circle cx="-96" cy="74" r="24" fill="#be185d" stroke="#f472b6" stroke-width="1.25"/>
      <text x="-96" y="79" fill="#fdf2f8">C</text>

      <circle cx="100" cy="74" r="24" fill="#0e7490" stroke="#22d3ee" stroke-width="1.25"/>
      <text x="100" y="79" fill="#ecfeff">D</text>

      <circle cx="0" cy="-108" r="18" fill="#334155" stroke="#94a3b8" stroke-width="1.25"/>
      <text x="0" y="-103" fill="#f1f5f9" font-size="12">E</text>
    </g>
  </g>
</svg>
