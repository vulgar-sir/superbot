name: superbot

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: superbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: superbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: superbot
    volumes:
      - superbot_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbot -d superbot"]
      interval: 5s
      timeout: 3s
      retries: 30

  dex:
    # Docker Hub is unreachable from this host; GHCR is reachable.
    image: ghcr.io/dexidp/dex:v2.41.1
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ../dex/config.yaml:/etc/dex/config.yaml:ro
    depends_on:
      - api

  stt:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small
      WHISPER__INFERENCE_DEVICE: cpu
      # Skip language auto-detection: the bundled ctranslate2 model can
      # return a null language payload and fail inside faster-whisper.
      WHISPER__DEFAULT_LANGUAGE: zh
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - superbot_stt_models:/root/.cache/huggingface

  tts:
    build:
      context: ./images/tts
      dockerfile: Dockerfile
    image: superbot/tts:latest
    restart: unless-stopped
    environment:
      HF_ENDPOINT: https://hf-mirror.com
      PIPER_VOICE: zh_CN-huayan-medium
    volumes:
      - superbot_tts_voices:/voices

  embedding:
    build:
      context: ./images/embedding
      dockerfile: Dockerfile
    image: superbot/embedding:latest
    restart: unless-stopped
    environment:
      # The HF mirror serves plain HTTP well but not the Xet CAS protocol;
      # disabling Xet avoids stalled multi-gigabyte model downloads.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - superbot_embedding_models:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: superbot/api:latest
    restart: unless-stopped
    # The API and worker run as the sandbox user, not root: they can write
    # inside workspaces but cannot replace the root-owned directories that
    # sandbox mounts come from (see deploy/harden-data-permissions.sh).
    user: "1000:1000"
    env_file:
      - ../.env
    environment:
      SUPERBOT_HTTP_ADDR: 0.0.0.0:8080
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "40000:40000/udp"
    volumes:
      - ../data:/srv/superbot/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The default network carries the API's own traffic (gw_priority): the
    # sandbox network is only for reaching bot computers, and the host
    # firewall (deploy/sandbox-firewall.sh) treats it as untrusted.
    networks:
      default:
        gw_priority: 100
      superbot_sandbox: {}

  worker:
    image: superbot/api:latest
    restart: unless-stopped
    command: ["worker"]
    user: "1000:1000"
    env_file:
      - ../.env
    environment:
      # The worker reaches Docker only through docker-proxy, never the raw
      # socket.
      DOCKER_HOST: tcp://docker-proxy:2375
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    volumes:
      - ../data:/srv/superbot/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        gw_priority: 100
      superbot_sandbox: {}
      superbot_docker: {}

  docker-proxy:
    # Allowlisting Docker Engine proxy (internal/dockerproxy): permits only
    # the sandbox container lifecycle and refuses privileged containers,
    # host mounts and every other endpoint. It holds the Docker socket, so
    # it gets no env_file, no published port, and only the internal network
    # it shares with the worker.
    image: superbot/api:latest
    restart: unless-stopped
    command: ["docker-proxy"]
    environment:
      # Host path of the data directory as the Docker daemon sees it; every
      # sandbox bind mount source must lie under it. The worker passes
      # SUPERBOT_DATA_DIR paths, so this only works where the host path
      # equals the in-container path (/srv/superbot/data).
      SUPERBOT_DOCKERPROXY_BIND_ROOT: /srv/superbot/data
      # Must list SUPERBOT_SANDBOX_IMAGE / SUPERBOT_DESKTOP_IMAGE and
      # SUPERBOT_SANDBOX_NETWORK if .env overrides them.
      SUPERBOT_DOCKERPROXY_IMAGES: superbot/computer:latest,superbot/computer-desktop:latest
      SUPERBOT_DOCKERPROXY_NETWORKS: superbot_sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted so bind sources can be checked for links on disk and new
      # workspace and team folders created on the worker's behalf.
      - ../data:/srv/superbot/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - superbot_docker

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: superbot/web:latest
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "32608:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./desktop-release:/srv/desktop-release:ro
    depends_on:
      - api
      - web

volumes:
  superbot_pgdata:
  superbot_embedding_models:
  superbot_stt_models:
  superbot_tts_voices:

networks:
  superbot_sandbox:
    name: superbot_sandbox
  superbot_docker:
    name: superbot_docker
    internal: true
