services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: superbot-postgres-dev
    environment:
      POSTGRES_USER: superbot
      POSTGRES_PASSWORD: superbot
      POSTGRES_DB: superbot
    ports:
      - "55432:5432"
    volumes:
      - superbot_pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbot -d superbot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  superbot_pgdata_dev:
