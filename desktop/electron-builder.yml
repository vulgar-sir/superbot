appId: com.superbot.desktop
productName: superbot
directories:
  output: release
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
linux:
  target:
    - AppImage
publish:
  provider: generic
  # Set this to the HTTPS directory that serves latest.yml and the installers.
  # See desktop/README.md for the expected layout.
  url: https://updates.example.com/superbot/desktop/
