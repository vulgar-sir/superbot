version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(go)"
    labels: ["dependencies"]
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
    labels: ["dependencies"]
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(desktop)"
    labels: ["dependencies"]
    groups:
      desktop-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "docker"
    directory: "/deploy/images/computer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(computer)"
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/deploy/images/embedding"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(embedding)"
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/deploy/images/tts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(tts)"
    labels: ["dependencies", "docker"]
