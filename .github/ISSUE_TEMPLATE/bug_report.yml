name: Bug report
description: Something is broken or behaves differently from what the documentation says.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.

        **Do not report security vulnerabilities here.** Use [private vulnerability reporting](https://github.com/vulgar-sir/superbot/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior, including the exact error text if there is one.
      placeholder: "When I ... the UI shows ... / the API returns ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal, repeatable sequence is the most useful thing you can provide.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose (production)
        - Local development
        - Desktop app
        - Other / custom
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version or `git rev-parse --short HEAD`.
      placeholder: "0.1.2 / a1b2c3d"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Go/Node version, and the LLM provider if it matters.
      placeholder: "Ubuntu 24.04, Chrome 145, Go 1.27.3, DeepSeek"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the smallest useful excerpt. Remove API keys, cookies, tokens and personal data.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag files here. Redact secrets, server addresses and personal information.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed all secrets, tokens and personal data from the report.
          required: true
        - label: This is not a security vulnerability (those go through private reporting).
          required: true
